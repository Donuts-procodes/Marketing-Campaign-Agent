[project]
name = "marketing-orchestrator"
version = "0.1.0"
description = "Strategy Sub-Orchestrator & Market Research Agent for AI Marketing Engine"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tavily-python>=0.5.0",
    "ddgs>=9.0",
    "pymongo>=4.9",
    "redis>=5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "grandalf>=0.8",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
# Needed only to accept BYOK keys from these providers (OpenAI works out of the box)
anthropic = ["langchain-anthropic>=0.3.0"]
gemini = ["langchain-google-genai>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "schemas", "agents", "subgraphs", "orchestrator"]

[tool.pyright]
extraPaths = [".."]

